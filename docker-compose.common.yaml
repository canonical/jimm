      # To Q/A this, use any reachable address for this compose JIMM. 
      JIMM_BOOTSTRAP_LOGIN_TOKEN_REFRESH_URL:  "${JIMM_BOOTSTRAP_LOGIN_TOKEN_REFRESH_URL:-https://jimm.localhost/.well-known/jwks.json}"
      GOTOOLCHAIN: auto
    healthcheck:
      test: [ "CMD", "curl", "http://jimm.localhost/.well-known/jwks.json" ]
      interval: 5s
      timeout: 5s
      retries: 50 # Should fail after approximately (interval*retry) seconds
    depends_on:
      db:
        condition: service_healthy
      openfga:
        condition: service_healthy
      traefik:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      vault:
        condition: service_healthy
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 20s
    labels:
      traefik.enable: true
      traefik.http.routers.jimm.rule: Host(`jimm.localhost`)
      traefik.http.routers.jimm.entrypoints: websecure
      traefik.http.routers.jimm.tls: true
      traefik.http.routers.jimm.service: "jimm"
      traefik.http.services.jimm.loadbalancer.server.port: 80
      traefik.http.routers.jimm-internal.rule: Host(`jimm-internal.localhost`)
      traefik.http.routers.jimm-internal.entrypoints: websecure
      traefik.http.routers.jimm-internal.tls: true
      traefik.http.routers.jimm-internal.service: "jimm-internal"
      traefik.http.services.jimm-internal.loadbalancer.server.port: 9090
