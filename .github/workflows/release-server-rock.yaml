name: Release Server ROCK

on:
  workflow_dispatch:
  workflow_call:

permissions: # Based on https://docs.github.com/en/actions/tutorials/publish-packages/publish-docker-images#publishing-images-to-github-packages
    contents: read
    packages: write
    attestations: write
    id-token: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - run: git fetch --tags --force origin # https://github.com/actions/checkout/issues/882 & https://github.com/actions/checkout/issues/290 

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Fix to build rock due to regression in LXD 5.21/stable https://discourse.ubuntu.com/t/mount-root-proc-cannot-mount-proc-read-only-with-lxd-5-21-2-22f93f4-from-snap/47533
      - name: Setup LXD
        uses: canonical/setup-lxd@main
        with:
          channel: 5.21/candidate

      - name: ln rockcraft.yaml
        run: ln -s ./rocks/jimm.yaml ./rockcraft.yaml
      
      - name: Build ROCK
        run: |
          /usr/bin/sudo snap install --channel stable --classic rockcraft && \
          rockcraft pack --platform ${{ matrix.arch }} --verbosity trace --use-lxd

      - name: Load ROCK into local registry
        run: make load-rock

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: 'jimm:latest'

      - name: Push to github package
        run: |
          base_tag=ghcr.io/canonical/jimm
          new_tag=$base_tag:${{ github.ref_name }}-${{ matrix.arch }}

          docker tag jimm:latest $new_tag
          docker push $new_tag

  publish-manifest:
    needs: publish
    runs-on: ubuntu-22.04
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture tags
        run: |
          base_tag=ghcr.io/canonical/jimm
          new_tag=$base_tag:${{ github.ref_name }}

          docker buildx imagetools create \
            --tag "$new_tag" \
            --tag "$base_tag:latest" \
            "$new_tag-amd64" \
            "$new_tag-arm64"
