name: Release Snaps

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build-and-release-jaas-plugin:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    uses: ./.github/workflows/snap-release.yaml
    with:
      folder: jaas
      release-channel: 3/edge
      architecture: ${{ matrix.arch }}
      runner: ${{ matrix.runner }}
    secrets: inherit

  build-jimm-server:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true
    - run: git fetch --tags --force origin # https://github.com/actions/checkout/issues/882 & https://github.com/actions/checkout/issues/290 
    - name: Setup snap to build
      run: |
        mkdir -p ./snap
        cp ./snaps/jimm/snapcraft.yaml ./snap/
    - uses: snapcore/action-build@v1
      id: snapcraft
      with:
        snapcraft-args: --build-for=${{ matrix.arch }}
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.snapcraft.outputs.snap }} 
        path: ${{ steps.snapcraft.outputs.snap }}

